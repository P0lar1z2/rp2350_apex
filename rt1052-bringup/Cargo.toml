[package]
name = "rt1052-bringup"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
nxp-host = []
nxp-enet = ["dep:smoltcp"]
nxp-device = ["dep:imxrt-ral", "dep:imxrt-usbd", "dep:usb-device"]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "1"
panic-rtt-target = "0.2.0"
rtt-target = "0.6.2"
imxrt-ral = { version = "0.6.2", features = ["imxrt1052"], optional = true }
imxrt-usbd = { version = "0.4.2", optional = true }
usb-device = { version = "0.3.2", features = ["control-buffer-256"], optional = true }
smoltcp = { version = "0.13.1", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-udp", "socket-dhcpv4"], optional = true }

[build-dependencies]
regex = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.8.23"

[[bin]]
name = "host_enumerate"
path = "src/bin/host_enumerate.rs"
required-features = ["nxp-host"]

[[bin]]
name = "enet_probe"
path = "src/bin/enet_probe.rs"

[[bin]]
name = "enet_dma_probe"
path = "src/bin/enet_dma_probe.rs"
required-features = ["nxp-enet"]

[[bin]]
name = "enet_control"
path = "src/bin/enet_control.rs"
required-features = ["nxp-enet"]

[[bin]]
name = "enet_loopback"
path = "src/bin/enet_loopback.rs"
required-features = ["nxp-enet"]

[[bin]]
name = "device_hid"
path = "src/bin/device_hid.rs"
required-features = ["nxp-host", "nxp-device"]

[[bin]]
name = "hid_bridge"
path = "src/bin/hid_bridge.rs"
required-features = ["nxp-host", "nxp-device"]

[profile.dev]
opt-level = 2

[profile.release]
debug = 2
lto = true
codegen-units = 1
