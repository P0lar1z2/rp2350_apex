[package]
name = "rt1052-bringup"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
nxp-host = []

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "1"
panic-rtt-target = "0.2.0"
rtt-target = "0.6.2"

[[bin]]
name = "host_enumerate"
path = "src/bin/host_enumerate.rs"
required-features = ["nxp-host"]

[profile.dev]
opt-level = 2

[profile.release]
debug = 2
lto = true
codegen-units = 1
