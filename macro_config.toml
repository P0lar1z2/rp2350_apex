version = 1

# Left Shift is trigger-only everywhere. It is still visible to the macro
# engine for chord detection, but is never forwarded to the computer.
always_mask = ["key.left_shift"]

[random]
# Zero mixes the RP2350 timer value into a nonzero built-in seed at boot.
seed = 0

[[layers]]
id = "off"
group = "firing_mode"
default = true

[layers.activation]
chord = ["key.left_ctrl", "key.kp_0"]
behavior = "select"
mask = ["key.kp_0"]

[[layers]]
id = "rapid_fire"
group = "firing_mode"

[layers.activation]
chord = ["key.left_ctrl", "key.kp_1"]
behavior = "select"
mask = ["key.kp_1"]

[[layers.macros]]
id = "side_button_rapid_fire"
repeat = "while_active"
sequence = [
  { do = "mouse.button_down", button = "left" },
  { do = "wait", ms = { min = 16, max = 22 } },
  { do = "mouse.button_up", button = "left" },
  { do = "wait", ms = { min = 72, max = 88 } },
]

[layers.macros.trigger]
chord = ["mouse.button5"]
behavior = "hold"
mask = "chord"

[[layers]]
id = "recoil"
group = "firing_mode"

[layers.activation]
chord = ["key.left_ctrl", "key.kp_2"]
behavior = "select"
mask = ["key.kp_2"]

[[layers.macros]]
id = "randomized_recoil"
repeat = "while_active"
sequence = [
  { do = "wait", ms = { min = 11, max = 15 } },
  { do = "repeat", repeat = { min = 2, max = 4 }, sequence = [
    { do = "mouse.move", x = { min = -1, max = 1 }, y = { min = 1, max = 3 } },
    { do = "wait", ms = { min = 12, max = 17 } },
  ] },
]

[layers.macros.trigger]
chord = ["mouse.right", "mouse.left"]
behavior = "hold"
mask = "none"

# Stage-one lurch isolation test. Holding Shift+W performs one forward
# slide-jump, makes A the final direction press inside the 400 ms post-jump
# lurch window, releases every direction key, then continuously bunny-hops on
# the resulting leftward momentum. No right/back input or wheel-up is generated.
[[layers]]
id = "lurch_strafe"
group = "lurch_strafe"
default = true

[[layers.macros]]
id = "left_bunny_hop_isolation"
repeat = "while_active"

# One-time launch and left turn. Fixed timings make the video trace unambiguous:
# Ctrl+W prepares the slide for 120 ms and jumps. The 80 ms wheel burst spans
# multiple game frames. At 120 ms after jump onset A is pressed while W remains
# held, producing 100 ms of W+A with continuous wheel-forward. W is then
# released while A and wheel-forward remain active for another 100 ms. A is the
# final direction press and is released 320 ms after jump onset, still inside
# the 400 ms lurch window. The remaining 360 ms reaches the next landing
# direction-free.
startup_sequence = [
  { do = "keyboard.key_down", key = "key.left_ctrl" },
  { do = "keyboard.key_down", key = "key.w" },
  { do = "wait", ms = 120 },
  { do = "mouse.wheel_burst", vertical = -1, duration_ms = 80 },
  { do = "wait", ms = 40 },
  { do = "keyboard.key_down", key = "key.a" },
  { do = "mouse.wheel_burst", vertical = 1, duration_ms = 100 },
  { do = "keyboard.key_up", key = "key.w" },
  { do = "mouse.wheel_burst", vertical = 1, duration_ms = 100 },
  { do = "keyboard.key_up", key = "key.a" },
  { do = "wait", ms = 360 },
]

# After the one-time left impulse, replay only a landing bunny-hop every 680 ms.
# Ctrl remains held, but W/A/S/D all remain released.
sequence = [
  { do = "mouse.wheel_burst", vertical = -1, duration_ms = 80 },
  { do = "wait", ms = 600 },
]

[layers.macros.trigger]
chord = ["key.left_shift", "key.w"]
behavior = "hold"
mask = ["key.w"]

# Hold Shift+S for Neo strafe. S is consumed as the trigger and Ctrl stays held
# until either trigger key is released. The repeated directional pattern is:
# D -> DW -> DWA -> A -> AS -> A -> AS -> ASD -> SD -> D.
[[layers]]
id = "neo_strafe"
group = "neo_strafe"
default = true

[[layers.macros]]
id = "held_neo_strafe"
repeat = "while_active"
sequence = [
  { do = "keyboard.key_down", key = "key.left_ctrl" },
  { do = "keyboard.key_down", key = "key.d" },

  # One bunny-hop scroll: 8 wheel-down inputs at 1 ms intervals.
  { do = "mouse.wheel_burst", vertical = -1, duration_ms = { min = 7, max = 9 } },
  { do = "wait", ms = { min = 140, max = 180 } },

  # D -> DW -> DWA, scrolling forward for each new lurch input.
  { do = "mouse.wheel_burst", vertical = 1, duration_ms = { min = 7, max = 9 } },
  { do = "keyboard.key_down", key = "key.w" },
  { do = "wait", ms = { min = 30, max = 50 } },

  { do = "mouse.wheel_burst", vertical = 1, duration_ms = { min = 7, max = 9 } },
  { do = "keyboard.key_down", key = "key.a" },
  { do = "wait", ms = { min = 70, max = 100 } },
  { do = "keyboard.key_up", key = "key.w" },
  { do = "keyboard.key_up", key = "key.d" },
  { do = "wait", ms = { min = 70, max = 110 } },

  # First S tap: A -> AS -> A.
  { do = "mouse.wheel_burst", vertical = 1, duration_ms = { min = 7, max = 9 } },
  { do = "keyboard.key_down", key = "key.s" },
  { do = "wait", ms = { min = 30, max = 50 } },
  { do = "keyboard.key_up", key = "key.s" },
  { do = "wait", ms = { min = 100, max = 130 } },

  # Second S input, then finish AS -> ASD -> SD -> D.
  { do = "mouse.wheel_burst", vertical = 1, duration_ms = { min = 7, max = 9 } },
  { do = "keyboard.key_down", key = "key.s" },
  { do = "wait", ms = { min = 70, max = 100 } },

  { do = "mouse.wheel_burst", vertical = 1, duration_ms = { min = 7, max = 9 } },
  { do = "keyboard.key_down", key = "key.d" },
  { do = "wait", ms = { min = 100, max = 130 } },
  { do = "keyboard.key_up", key = "key.a" },
  { do = "wait", ms = { min = 30, max = 50 } },
  { do = "keyboard.key_up", key = "key.s" },
]

[layers.macros.trigger]
chord = ["key.left_shift", "key.s"]
behavior = "hold"
mask = ["key.s"]
