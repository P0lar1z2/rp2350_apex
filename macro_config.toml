version = 1

# Left Shift is trigger-only everywhere. It is still visible to the macro
# engine for chord detection, but is never forwarded to the computer.
always_mask = ["key.left_shift"]

[random]
# Zero mixes the RP2350 timer value into a nonzero built-in seed at boot.
seed = 0

[[layers]]
id = "off"
group = "firing_mode"
default = true

[layers.activation]
chord = ["key.left_ctrl", "key.kp_0"]
behavior = "select"
mask = ["key.kp_0"]

[[layers]]
id = "rapid_fire"
group = "firing_mode"

[layers.activation]
chord = ["key.left_ctrl", "key.kp_1"]
behavior = "select"
mask = ["key.kp_1"]

[[layers.macros]]
id = "side_button_rapid_fire"
repeat = "while_active"
sequence = [
  { do = "mouse.button_down", button = "left" },
  { do = "wait", ms = { min = 16, max = 22 } },
  { do = "mouse.button_up", button = "left" },
  { do = "wait", ms = { min = 72, max = 88 } },
]

[layers.macros.trigger]
chord = ["mouse.button5"]
behavior = "hold"
mask = "chord"

[[layers]]
id = "recoil"
group = "firing_mode"

[layers.activation]
chord = ["key.left_ctrl", "key.kp_2"]
behavior = "select"
mask = ["key.kp_2"]

[[layers.macros]]
id = "randomized_recoil"
repeat = "while_active"
sequence = [
  { do = "wait", ms = { min = 11, max = 15 } },
  { do = "repeat", repeat = 3, sequence = [
    { do = "mouse.move", x = { min = -1, max = 1 }, y = { min = 1, max = 3 } },
    { do = "wait", ms = { min = 12, max = 17 } },
  ] },
]

[layers.macros.trigger]
chord = ["mouse.right", "mouse.left"]
behavior = "hold"
mask = "none"

# Always-on lurch strafe. Holding Shift+W continuously replays it, alternating
# left-to-right and right-to-left on every pass. Both trigger keys are consumed.
[[layers]]
id = "lurch_strafe"
group = "lurch_strafe"
default = true

[[layers.macros]]
id = "alternating_lurch_strafe"
repeat = "while_active"
alternate_on_repeat = true

# Left to right. A is established before jump; every subsequent direction-down
# lands inside the 400 ms lurch window. Wheel-down is jump and wheel-up is the
# stacked forward input.
sequence = [
  { do = "keyboard.key_down", key = "key.a" },
  { do = "wait", ms = { min = 16, max = 24 } },
  { do = "mouse.wheel_burst", vertical = -1, duration_ms = 32 },
  { do = "wait", ms = { min = 45, max = 55 } },
  { do = "keyboard.key_down", key = "key.w" },
  { do = "wait", ms = { min = 65, max = 80 } },
  { do = "keyboard.key_down", key = "key.d" },
  { do = "wait", ms = { min = 12, max = 18 } },
  { do = "keyboard.key_up", key = "key.w" },
  { do = "wait", ms = { min = 4, max = 8 } },
  { do = "keyboard.key_up", key = "key.a" },
  { do = "mouse.wheel_burst", vertical = 1, duration_ms = 48 },
  { do = "wait", ms = { min = 30, max = 42 } },
  { do = "keyboard.key_down", key = "key.s" },
  { do = "mouse.wheel_burst", vertical = 1, duration_ms = 48 },
  { do = "wait", ms = { min = 34, max = 50 } },
  { do = "keyboard.key_up", key = "key.d" },
  { do = "keyboard.key_up", key = "key.s" },
  { do = "wait", ms = { min = 16, max = 24 } },
]

# Right to left is the exact A/D mirror of the sequence above.
alternate_sequence = [
  { do = "keyboard.key_down", key = "key.d" },
  { do = "wait", ms = { min = 16, max = 24 } },
  { do = "mouse.wheel_burst", vertical = -1, duration_ms = 32 },
  { do = "wait", ms = { min = 45, max = 55 } },
  { do = "keyboard.key_down", key = "key.w" },
  { do = "wait", ms = { min = 65, max = 80 } },
  { do = "keyboard.key_down", key = "key.a" },
  { do = "wait", ms = { min = 12, max = 18 } },
  { do = "keyboard.key_up", key = "key.w" },
  { do = "wait", ms = { min = 4, max = 8 } },
  { do = "keyboard.key_up", key = "key.d" },
  { do = "mouse.wheel_burst", vertical = 1, duration_ms = 48 },
  { do = "wait", ms = { min = 30, max = 42 } },
  { do = "keyboard.key_down", key = "key.s" },
  { do = "mouse.wheel_burst", vertical = 1, duration_ms = 48 },
  { do = "wait", ms = { min = 34, max = 50 } },
  { do = "keyboard.key_up", key = "key.a" },
  { do = "keyboard.key_up", key = "key.s" },
  { do = "wait", ms = { min = 16, max = 24 } },
]

[layers.macros.trigger]
chord = ["key.left_shift", "key.w"]
behavior = "hold"
mask = ["key.w"]

# Hold Shift+S for Neo strafe. S is consumed as the trigger and Ctrl stays held
# until either trigger key is released. The repeated directional pattern is:
# D -> DW -> DWA -> A -> AS -> A -> AS -> ASD -> SD -> D.
[[layers]]
id = "neo_strafe"
group = "neo_strafe"
default = true

[[layers.macros]]
id = "held_neo_strafe"
repeat = "while_active"
sequence = [
  { do = "keyboard.key_down", key = "key.left_ctrl" },
  { do = "keyboard.key_down", key = "key.d" },

  # One bunny-hop scroll: 8 wheel-down inputs at 1 ms intervals.
  { do = "mouse.wheel_burst", vertical = -1, duration_ms = 8 },
  { do = "wait", ms = { min = 140, max = 180 } },

  # D -> DW -> DWA, scrolling forward for each new lurch input.
  { do = "mouse.wheel_burst", vertical = 1, duration_ms = 8 },
  { do = "keyboard.key_down", key = "key.w" },
  { do = "wait", ms = { min = 30, max = 50 } },

  { do = "mouse.wheel_burst", vertical = 1, duration_ms = 8 },
  { do = "keyboard.key_down", key = "key.a" },
  { do = "wait", ms = { min = 70, max = 100 } },
  { do = "keyboard.key_up", key = "key.w" },
  { do = "keyboard.key_up", key = "key.d" },
  { do = "wait", ms = { min = 70, max = 110 } },

  # First S tap: A -> AS -> A.
  { do = "mouse.wheel_burst", vertical = 1, duration_ms = 8 },
  { do = "keyboard.key_down", key = "key.s" },
  { do = "wait", ms = { min = 30, max = 50 } },
  { do = "keyboard.key_up", key = "key.s" },
  { do = "wait", ms = { min = 100, max = 130 } },

  # Second S input, then finish AS -> ASD -> SD -> D.
  { do = "mouse.wheel_burst", vertical = 1, duration_ms = 8 },
  { do = "keyboard.key_down", key = "key.s" },
  { do = "wait", ms = { min = 70, max = 100 } },

  { do = "mouse.wheel_burst", vertical = 1, duration_ms = 8 },
  { do = "keyboard.key_down", key = "key.d" },
  { do = "wait", ms = { min = 100, max = 130 } },
  { do = "keyboard.key_up", key = "key.a" },
  { do = "wait", ms = { min = 30, max = 50 } },
  { do = "keyboard.key_up", key = "key.s" },
]

[layers.macros.trigger]
chord = ["key.left_shift", "key.s"]
behavior = "hold"
mask = ["key.s"]
